services:
  # Panel web (React) y API (FastAPI) en un solo contenedor: http://localhost:8000
  web:
    build: .
    container_name: communitylab_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Credenciales de OCI (wallet y llave .pem), capturas de Discord, paquetes, caché y base local.
      # Las rutas relativas del .env (data/wallet/..., data/oci_api_key.pem) apuntan aquí.
      - ./data:/app/data
    restart: unless-stopped
