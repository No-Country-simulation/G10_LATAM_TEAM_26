# CI en cada push y pull request: pruebas de la API, compilado del front y de la imagen Docker.
# CD solo en push a main: publica la imagen en GHCR y la despliega en la VM de OCI por SSH.
# Configuración del servidor y de los secretos: docs/despliegue-oci.md
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  front:
    name: Front (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  imagen:
    name: Imagen Docker
    needs: [api, front]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    env:
      PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: nombre
        # GHCR exige el nombre en minúsculas
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLICAR == 'true'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLICAR == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Las VM Always Free de OCI suelen ser Ampere (arm64); al publicar se compila para ambas arquitecturas
          platforms: ${{ env.PUBLICAR == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en OCI
    needs: imagen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      IMAGEN: ${{ needs.imagen.outputs.imagen }}:${{ github.sha }}
      DIR_APP: communitylab
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secretos
        id: secretos
        run: |
          if [ -z "$OCI_HOST" ] || [ -z "$OCI_USER" ]; then
            echo "::warning::Faltan los secretos OCI_HOST / OCI_USER / OCI_SSH_KEY: se omite el despliegue (ver docs/despliegue-oci.md)"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar SSH
        if: steps.secretos.outputs.listo == 'true'
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          # Huella fija del servidor si está configurada; si no, se toma al vuelo
          if [ -n "$OCI_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$OCI_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Copiar compose de producción y datos de ejemplo
        if: steps.secretos.outputs.listo == 'true'
        # data/ del servidor se monta sobre /app/data y tapa los fixtures de la imagen: se copian al volumen
        run: |
          ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" "mkdir -p ~/$DIR_APP/data/fixtures"
          scp -i ~/.ssh/id_oci deploy/docker-compose.prod.yml "$OCI_USER@$OCI_HOST:~/$DIR_APP/docker-compose.yml"
          tar -C data/fixtures --exclude='lote_g26*' -cf - . | ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" "tar -C ~/$DIR_APP/data/fixtures -xf -"
      - name: Actualizar contenedor
        if: steps.secretos.outputs.listo == 'true'
        # La VM descarga la imagen de GHCR con su propio acceso (paquete público o login hecho una vez en el
        # servidor); ningún token de GitHub Actions sale hacia la VM.
        run: |
          ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" \
            "cd ~/$DIR_APP && IMAGEN='$IMAGEN' bash -s" < deploy/actualizar.sh
